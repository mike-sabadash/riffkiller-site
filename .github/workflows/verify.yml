name: Verify RiffKiller
on:
  pull_request:
  push:
    branches: [codex/restore-riffkiller-20261019]
permissions:
  contents: read
jobs:
  practice-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:recovery
      - run: npm run test:e2e
      - name: PHP syntax
        run: find api config -name '*.php' -print0 | xargs -0 -n1 php -l
