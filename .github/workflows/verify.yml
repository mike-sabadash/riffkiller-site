name: Verify RiffKiller
on:
  pull_request:
  push:
    branches: [codex/restore-riffkiller-20261019]
permissions:
  contents: read
jobs:
  practice-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The runner image has PHP; ffmpeg comes as a static build from GitHub, not from apt, whose mirror and
      # dpkg lock have hung or failed several runs.
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: PHP and ffmpeg
        run: php -v | head -1 && ffmpeg -version | head -1
      - run: npm test
      - run: npm run test:recovery
      - run: npm run test:e2e
      - name: PHP syntax
        run: find api config -name '*.php' -print0 | xargs -0 -n1 php -l
