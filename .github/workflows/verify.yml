name: Verify RiffKiller
on:
  pull_request:
  push:
    branches: [codex/restore-riffkiller-20261019]
permissions:
  contents: read
jobs:
  practice-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: PHP and ffmpeg
        timeout-minutes: 8
        # apt on the runners sometimes hangs for good; skip what is installed, skip man pages, retry with a limit.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          need=""; command -v php >/dev/null || need="$need php-cli"; command -v ffmpeg >/dev/null || need="$need ffmpeg"
          if [ -n "$need" ]; then
            for i in 1 2 3; do timeout 150 sh -c "sudo apt-get update -qq && sudo apt-get install -y -qq $need" && break; done
          fi
          php -v | head -1 && ffmpeg -version | head -1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:recovery
      - run: npm run test:e2e
      - name: PHP syntax
        run: find api config -name '*.php' -print0 | xargs -0 -n1 php -l
