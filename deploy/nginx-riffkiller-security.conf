# Include inside the riffkiller.fun `server { ... }` block, BEFORE the PHP location:
#   include /etc/nginx/snippets/riffkiller-security.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Server-side state, PHP includes, tests and tooling are never served directly.
location ~ ^/(data|config|tests|tools|backups|node_modules|sessions|deploy)(/|$) {
    return 404;
}
# Dotfiles (.env, .git, .htaccess) except ACME challenges.
location ~ /\.(?!well-known/) {
    return 404;
}
# Logs, editor backups, archives, docs and dev scripts.
location ~* \.(log|save|zip|md|cjs|py)$ {
    return 404;
}
