# Install as /etc/nginx/sites-available/riffkiller.fun after reviewing PHP socket.
server {
    listen 80;
    listen [::]:80;
    server_name riffkiller.fun www.riffkiller.fun;
    root /var/www/riffkiller;
    index index.html index.php;

    client_max_body_size 110m;

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:log|zip|bak|save)$ {
        deny all;
    }

    location ^~ /data/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
