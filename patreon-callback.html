<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n.js?v=nm1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Riff Killer - Patreon Authorization</title>
    
    <style>
        body {
            background-color: #111629;
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .callback-container {
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #9355E5;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 400;
        }
        
        p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
        }
        
        .error-message {
            color: #F44336;
            margin-top: 20px;
            padding: 10px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            display: none;
        }
        .callback-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
        .callback-actions button { min-height: 48px; border: none; border-radius: 12px; background: #9355e5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        .callback-actions a { color: #c4b5fc; text-decoration: underline; text-underline-offset: 2px; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="loader"></div>
        <h1>Connecting to Patreon...</h1>
        <p>Please wait while we complete the authorization</p>
        <div class="error-message" id="errorMessage"></div>
    </div>
    
    <script src="js/patreon-config.js"></script>
    <script src="js/auth-manager.js?v=nm1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDiv = document.getElementById('errorMessage');
            const count = window.rkCount || function () {};
            let hadState = false;
            try { hadState = !!localStorage.getItem('patreonState'); } catch (e) {}
            const fromHost = (function () { try { return new URL(document.referrer).hostname.replace(/^www\./, '').split('.')[0] || 'none'; } catch (e) { return 'none'; } })();
            // What came back from Patreon (our own daily totals): code / error / nothing, same browser or not, from where.
            count('patreon_back:' + (error ? 'error-' + String(error).toLowerCase().replace(/[^a-z_]/g, '').slice(0, 20) : code ? 'code' : 'none') + ':' + (hadState ? 'same' : 'other') + '-' + fromHost.replace(/[^a-z0-9-]/g, '').slice(0, 12));
            // Where to go back to: the riff the person came from (rkDropReturn, 15 minutes), else the library.
            function backUrl() {
                try {
                    const back = JSON.parse(localStorage.getItem('rkDropReturn') || 'null');
                    if (back && Date.now() - back.at < 15 * 60 * 1000 && /^\/practice\.html\?[\w=&%-]*$/.test(back.url)) return back.url;
                } catch (e) {}
                return 'index.html';
            }
            // No automatic redirect: the person picks what to do next.
            function fail(title, text) {
                document.querySelector('.loader').style.display = 'none';
                document.querySelector('h1').textContent = title;
                document.querySelector('p').textContent = '';
                errorDiv.style.display = 'block';
                errorDiv.textContent = text;
                const box = document.createElement('div');
                box.className = 'callback-actions';
                box.innerHTML = '<button type="button" id="patreonRetry">Try Patreon again</button>' +
                    '<a id="patreonUseEmail" href="#">Sign up with email instead</a>';
                document.querySelector('.callback-container').appendChild(box);
                document.getElementById('patreonRetry').addEventListener('click', function () { count('patreon_back:retry'); window.authManager.loginPatreon(); });
                document.getElementById('patreonUseEmail').addEventListener('click', function (e) {
                    e.preventDefault();
                    count('patreon_back:use_email');
                    const url = backUrl();
                    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'auth=signup';
                });
            }

            // Diagnostic: log exactly what the page received (helps find server redirects that strip query string)
            console.log('[Patreon callback] URL=', window.location.href, '| search=', window.location.search, '| code=', code ? '(present)' : 'MISSING', '| state=', state ? '(present)' : '', '| error=', error || '');

            if (error) {
                console.error('[Patreon callback] error param:', error);
                fail('Patreon sign-in stopped', error === 'access_denied'
                    ? 'Patreon says access wasn’t allowed. Try again and tap Allow, or sign up with email.'
                    : 'Patreon couldn’t finish signing you in. Try again, or sign up with email: it takes 20 seconds.');
                return;
            }

            if (!code) {
                console.warn('[Patreon callback] no code in URL');
                fail('Patreon didn’t send you back', 'Sometimes the Patreon app gets in the way. Try again, or sign up with email: it takes 20 seconds.');
                return;
            }

            try {
                const redirectUri = (typeof PATREON_CONFIG !== 'undefined' && PATREON_CONFIG.redirectUri)
                    ? PATREON_CONFIG.redirectUri
                    : 'https://riffkiller.fun/patreon-callback.html';
                const response = await fetch('patreon-exchange.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, state: state || null, redirect_uri: redirectUri })
                });
                const rawBody = await response.text();
                let data = {};
                try {
                    data = rawBody ? JSON.parse(rawBody) : {};
                } catch (parseErr) {
                    console.error('[Patreon callback] Exchange response not JSON. status=', response.status, 'body (first 300)=', rawBody.substring(0, 300));
                }
                console.log('[Patreon callback] Exchange: status=', response.status, 'ok=', response.ok, 'data.success=', data.success, 'data.error=', data.error || '');

                if (!response.ok && !data.error) {
                    data.success = false;
                    data.error = 'Server returned ' + response.status + (response.status === 404 ? ' (patreon-exchange.php not found?)' : '');
                }

                if (data.success) {
                    console.log('[Patreon callback] Success -> application (800ms)');
                    if (window.patreonAuth) {
                        window.patreonAuth.token = data.token;
                        window.patreonAuth.userData = data.user;
                        window.patreonAuth.isAuthenticated = true;
                        window.patreonAuth.updateSubscription('patreon', data.subscription || { status: 'active' });
                        window.patreonAuth.saveSession();
                        window.patreonAuth.notifyListeners();
                        window.patreonAuth.updateAllAuthButtons();
                    }
                    document.querySelector('h1').textContent = 'Success!';
                    document.querySelector('p').textContent = 'Returning to RiffKiller...';
                    setTimeout(function() {
                        window.location.href = 'app.html';
                    }, 800);
                } else {
                    console.error('[Patreon callback] REDIRECT SOURCE: exchange failed (data.success false) -> throw -> catch -> index.html?auth=error (5s)', { status: response.status, data: data });
                    let errMsg = data.error || 'Server error';
                    if (data.patreon_description) errMsg += ' (' + data.patreon_description + ')';
                    if (data.patreon_error) errMsg += ' [code: ' + data.patreon_error + ']';
                    throw new Error(errMsg);
                }
            } catch (e) {
                console.error('[Patreon callback] exchange failed:', e && e.message, e);
                count('patreon_back:exchange_fail');
                fail('Patreon sign-in didn’t go through', 'Try again, or sign up with email: it takes 20 seconds.');
            }
        });
    </script>
</body>
</html>
