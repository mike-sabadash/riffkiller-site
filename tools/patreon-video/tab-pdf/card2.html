<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IN;src:url(inter-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:IN;src:url(inter-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IN;src:url(inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IN;src:url(inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(inter-latin-800-normal.woff2);font-weight:800}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--soft:#8f8f8f;--mid:#444;--lime:#B8F05A;--dark:#0B0B0F}
html,body{background:#fff;color:var(--ink);font-family:IN,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-font-smoothing:antialiased}
.page{width:794px;height:1123px;padding:52px 56px 44px;position:relative;overflow:hidden;page-break-after:always;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:13px}
.kick{font-size:8.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.hero{display:grid;grid-template-columns:1fr 250px;margin-top:34px;gap:0}
.hero .l{padding-right:20px}
.eb{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
h1{font-size:62px;font-weight:800;letter-spacing:-.045em;line-height:.92;margin-top:12px}
.sub{font-size:19px;font-weight:500;color:var(--mid);margin-top:8px;letter-spacing:-.01em}
.meta{display:flex;gap:26px;margin-top:22px}
.meta div{font-size:11px;color:var(--mid);font-weight:500}
.meta b{display:block;font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:4px}
.rule{background:var(--lime);padding:18px 20px 20px;display:flex;flex-direction:column;justify-content:space-between}
.rule .eb{color:#0B0B0F;opacity:.7}
.rule p{font-size:17px;font-weight:700;line-height:1.18;letter-spacing:-.02em;color:#0B0B0F;margin-top:10px}
.rule small{display:block;font-size:9.5px;font-weight:500;color:rgba(11,11,15,.75);margin-top:12px;line-height:1.4}
.sec{margin-top:26px}
h2{font-size:8.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;display:flex;justify-content:space-between}
h2 span{letter-spacing:.1em;font-weight:600}
.tabwin{position:relative;overflow:hidden}
.tabwin .inner{position:absolute;left:0;top:0}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:8.5px;color:var(--soft);letter-spacing:.04em;padding-top:10px}
.foot img{height:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:9px;color:var(--mid);margin-top:2px}
.legend i{font-style:normal;font-weight:700;color:var(--ink)}
/* parts */
.parts{columns:2;column-gap:26px}
.pt{break-inside:avoid;display:flex;gap:9px;padding:6px 0;border-top:1px solid #ececec}
.pt .n{flex:0 0 18px;font-size:10px;font-weight:800;padding-top:1px}
.pt .r{display:inline-block;font-size:7px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 5px 1.5px;color:#0B0B0F;margin-right:6px;vertical-align:1px}
.pt .s{font-size:7.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.pt p{font-size:9.5px;line-height:1.42;color:var(--mid);margin-top:3px}
.tips{columns:2;column-gap:26px}
.tp{break-inside:avoid;display:flex;gap:9px;padding:7px 0;border-top:1px solid #ececec}
.tp .n{flex:0 0 18px;height:18px;background:var(--lime);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tp b{font-size:10.5px;font-weight:700}
.tp em{font-style:normal;font-size:7px;font-weight:800;letter-spacing:.12em;background:#111;color:#fff;padding:2px 4px 1.5px;margin-left:6px;vertical-align:1px}
.tp .lb{font-size:9.5px;color:var(--soft);font-weight:500}
.tp p{font-size:9.5px;line-height:1.42;color:var(--mid);margin-top:2px}
.tp .w{font-size:8px;color:var(--soft);margin-top:2px}
.dna{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dna p{font-size:10.5px;line-height:1.5;color:var(--mid)}
.dna ul{list-style:none}
.dna li{font-size:10px;line-height:1.35;padding:4px 0 4px 14px;position:relative;color:var(--ink)}
.dna li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--lime)}
.dna li.x:before{background:#d6d6d6}
.mut{background:var(--dark);color:#fff;padding:20px 22px;margin-top:22px}
.mut .eb{color:var(--lime)}
.mut h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.mut .d{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:6px;line-height:1.45}
.st{display:flex;gap:10px;margin-top:10px;font-size:10px;line-height:1.45;color:rgba(255,255,255,.9)}
.st i{flex:0 0 18px;height:18px;background:var(--lime);color:#0B0B0F;font-style:normal;font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center}
.hero2{margin-top:30px;margin-bottom:26px}
.hero2 h1{margin-top:0}
.tab{width:682px}
#measure{position:absolute;left:-5000px;top:0;width:682px}
</style></head>
<body>
<div id="measure"></div>
<div id="pages"></div>
<script src="alphaTab.min.js"></script>
<script src="card2.js"></script>
</body></html>
