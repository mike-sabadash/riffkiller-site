<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:I;font-weight:500;src:url(assets/inter-latin-500-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(assets/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:700;src:url(assets/inter-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(assets/inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(assets/inter-latin-900-normal.woff2)}
html,body{margin:0;padding:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0a0a0f;font-family:I,sans-serif;color:#fff}
.abs{position:absolute;left:0;top:0}
#bg{width:1080px;height:1920px}
#cam{transform-origin:0 0;will-change:transform}
#phone{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:196.5px 426px}
#bezel{position:absolute;left:-15px;top:-15px;width:423px;height:882px;border-radius:66px;
  background:linear-gradient(145deg,#4a4a52 0%,#1b1b20 18%,#0c0c0f 50%,#1b1b20 82%,#45454d 100%);
  box-shadow:0 0 0 1.2px #6b6b75 inset,0 40px 90px rgba(0,0,0,.65),0 0 140px rgba(147,85,229,.28)}
#bezel:after{content:"";position:absolute;left:5px;top:5px;right:5px;bottom:5px;border-radius:61px;background:#050506}
#screen{position:absolute;left:0;top:0;width:393px;height:852px;border-radius:50px;overflow:hidden;background:#0b0b0f}
#screen img{position:absolute;left:0;top:0;width:393px;height:852px}
#vid{position:absolute;left:15px;width:363px;height:204.2px;overflow:hidden;border-radius:9px;display:none}
#vid img{position:absolute;left:0;top:0;width:363px;height:204.2px}
.cut{position:absolute;overflow:hidden;display:none}
.cut img{position:absolute;width:393px;height:852px}
#island{position:absolute;left:146px;top:11px;width:101px;height:30px;border-radius:15px;background:#000;z-index:3}
#glare{position:absolute;left:0;top:0;width:393px;height:852px;border-radius:50px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 35%);z-index:2}
#reelBox{position:absolute;overflow:hidden}
#reelBox img{position:absolute}
#full{width:1080px;height:1920px;overflow:hidden}
#full img{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 800px}
#scrim{width:1080px;height:1920px;background:linear-gradient(180deg,rgba(0,0,0,0) 48%,rgba(4,3,8,.72) 66%,rgba(4,3,8,.9) 100%)}
#taps{width:1080px;height:1920px}
.tap{position:absolute;border-radius:50%}
#titles{width:1080px;height:1920px}
.line{position:absolute;left:0;width:1080px;text-align:center;overflow:hidden;line-height:1}
.line span{display:inline-block;position:relative;font-weight:900;text-transform:uppercase;letter-spacing:-0.025em;padding:0 .08em}
.hl{position:absolute;left:-.02em;right:-.02em;top:.04em;bottom:.02em;background:#9355E5;border-radius:.12em;transform-origin:0 50%;z-index:-1}
.sub{font-weight:600 !important;text-transform:none !important;letter-spacing:0 !important;color:#c9c6d6}
#flash{width:1080px;height:1920px;background:#fff;opacity:0}
#grain{width:1080px;height:1920px;opacity:.06;background:url(assets/noise.png);mix-blend-mode:overlay}
#pack{width:1080px;height:1920px}
.card{position:absolute;width:400px;height:228px;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08)}
.card img{width:100%;height:100%;object-fit:cover}
.free{position:absolute;left:12px;top:12px;background:#CFFF55;color:#0a0a0f;font-weight:800;font-size:22px;padding:5px 12px;border-radius:9px}
</style></head>
<body><div id="stage">
  <div id="bg" class="abs"></div>
  <div id="cam" class="abs"><div id="phone"><div id="bezel"></div><div id="screen"><img id="scr"><div id="vid"><img id="vidImg"></div><div id="strip" class="cut"><img id="stripImg"></div><div id="badge" class="cut"><img id="badgeImg"></div><div id="glare"></div></div><div id="island"></div></div></div>
  <div id="reelBox"><img id="reelImg"></div>
  <div id="full" class="abs"><img id="fullImg"></div>
  <div id="pack" class="abs"></div>
  <div id="taps" class="abs"></div>
  <div id="scrim" class="abs"></div>
  <div id="titles" class="abs"></div>
  <div id="flash" class="abs"></div>
  <div id="grain" class="abs"></div>
</div>
<script src="comp.js"></script>
</body></html>
